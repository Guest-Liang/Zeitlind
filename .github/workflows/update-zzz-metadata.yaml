name: Check ZZZ Liyin Achievement Metadata
run-name: Check ZZZ Liyin achievement metadata

on:
  schedule:
    # 每天 UTC+8 10:17 检查。避开整点可减少 GitHub 定时任务拥堵。
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-zzz-liyin-achievement-metadata
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Ticca-Liyin/zzz.liyin.space
  UPSTREAM_BRANCH: main
  UPSTREAM_PATH: src/jsons/AchievementInfo.json
  METADATA_PATH: src/Zeitlind.Protocol/Metadata/ZzzAchievementInfo.json
  UPDATE_BRANCH: automation/update-zzz-liyin-achievement-metadata

jobs:
  check:
    name: Check and propose metadata update
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Continue an existing update pull request
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          open_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$UPDATE_BRANCH" \
              --json number \
              --jq '.[0].number'
          )"

          if [[ -n "$open_pr" ]]; then
            git fetch \
              origin \
              "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
            git switch \
              --force-create \
              "$UPDATE_BRANCH" \
              "refs/remotes/origin/$UPDATE_BRANCH"
          fi

          echo "open_pr=$open_pr" >> "$GITHUB_OUTPUT"

      - name: Download, validate, and compare metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          candidate="$RUNNER_TEMP/AchievementInfo.json"
          content_json="$(
            gh api \
              "repos/$UPSTREAM_REPOSITORY/contents/$UPSTREAM_PATH?ref=$UPSTREAM_BRANCH"
          )"
          download_url="$(jq -r '.download_url' <<< "$content_json")"
          upstream_blob="$(jq -r '.sha' <<< "$content_json")"
          upstream_size="$(jq -r '.size' <<< "$content_json")"
          source_commit="$(
            gh api \
              "repos/$UPSTREAM_REPOSITORY/commits?path=$UPSTREAM_PATH&sha=$UPSTREAM_BRANCH&per_page=1" \
              --jq '.[0].sha'
          )"

          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid upstream commit: $source_commit" >&2
            exit 1
          fi
          if [[ ! "$upstream_blob" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid upstream Git blob: $upstream_blob" >&2
            exit 1
          fi
          if [[ "$download_url" != \
              "https://raw.githubusercontent.com/$UPSTREAM_REPOSITORY/"* ]]; then
            echo "Unexpected upstream download URL: $download_url" >&2
            exit 1
          fi
          if (( upstream_size <= 0 || upstream_size > 4194304 )); then
            echo "Unexpected upstream size: $upstream_size bytes" >&2
            exit 1
          fi

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 45 \
            --output "$candidate" \
            "$download_url"

          downloaded_size="$(wc -c < "$candidate")"
          if [[ "$downloaded_size" -ne "$upstream_size" ]]; then
            echo "Downloaded $downloaded_size bytes; GitHub reported $upstream_size." >&2
            exit 1
          fi

          downloaded_blob="$(git hash-object --no-filters "$candidate")"
          if [[ "$downloaded_blob" != "$upstream_blob" ]]; then
            echo "Downloaded Git blob $downloaded_blob does not match $upstream_blob." >&2
            exit 1
          fi

          validate_filter='
            type == "object" and
            length >= 100 and
            all(
              to_entries[];
              (.key | test("^[0-9]{7}$")) and
              (.value | type == "object") and
              (.value.Id | type == "number") and
              ((.value.Id | tostring) == .key) and
              (.value.Version | type == "string") and
              (.value.Version | test("^[0-9]+(\\.[0-9]+){1,2}$"))
            )
          '
          jq --exit-status "$validate_filter" "$METADATA_PATH" > /dev/null
          jq --exit-status "$validate_filter" "$candidate" > /dev/null

          old_count="$(jq 'length' "$METADATA_PATH")"
          new_count="$(jq 'length' "$candidate")"
          if (( new_count * 10 < old_count * 8 )); then
            echo "Catalog shrank from $old_count to $new_count; refusing automatic update." >&2
            exit 1
          fi

          version_filter='
            [.[].Version]
            | unique
            | sort_by(split(".") | map(tonumber))
            | last
          '
          old_version="$(jq -r "$version_filter" "$METADATA_PATH")"
          new_version="$(jq -r "$version_filter" "$candidate")"
          added_count="$(
            jq \
              --null-input \
              --slurpfile old "$METADATA_PATH" \
              --slurpfile new "$candidate" \
              '($new[0] | keys) - ($old[0] | keys) | length'
          )"
          removed_count="$(
            jq \
              --null-input \
              --slurpfile old "$METADATA_PATH" \
              --slurpfile new "$candidate" \
              '($old[0] | keys) - ($new[0] | keys) | length'
          )"
          modified_count="$(
            jq \
              --null-input \
              --slurpfile old "$METADATA_PATH" \
              --slurpfile new "$candidate" \
              '[
                ($new[0] | keys[]) as $key
                | select(
                    ($old[0] | has($key)) and
                    ($new[0][$key] != $old[0][$key])
                  )
              ] | length'
          )"

          current_blob="$(git hash-object --no-filters "$METADATA_PATH")"
          if [[ "$current_blob" == "$downloaded_blob" ]]; then
            changed=false
          else
            changed=true
            cp "$candidate" "$METADATA_PATH"
          fi

          {
            echo "changed=$changed"
            echo "old_count=$old_count"
            echo "new_count=$new_count"
            echo "old_version=$old_version"
            echo "new_version=$new_version"
            echo "added_count=$added_count"
            echo "removed_count=$removed_count"
            echo "modified_count=$modified_count"
            echo "source_commit=$source_commit"
            echo "source_blob=$downloaded_blob"
          } >> "$GITHUB_OUTPUT"

          if [[ "$changed" == true ]]; then
            heading="Liyin achievement metadata update found"
          else
            heading="Liyin achievement metadata is current"
          fi
          {
            echo "## $heading"
            echo
            echo "| Metric | Old | New |"
            echo "|---|---:|---:|"
            echo "| Latest version | $old_version | $new_version |"
            echo "| Entries | $old_count | $new_count |"
            echo
            echo "- Added: $added_count"
            echo "- Removed: $removed_count"
            echo "- Modified: $modified_count"
            echo "- Upstream commit: \`$source_commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push metadata update
        if: steps.metadata.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git diff --check
          if [[ "$(git branch --show-current)" != "$UPDATE_BRANCH" ]]; then
            git switch --force-create "$UPDATE_BRANCH"
          fi
          git config user.name "github-actions[bot]"
          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$METADATA_PATH"
          git commit -m "chore: update ZZZ Liyin achievement metadata"

          remote_line="$(
            git ls-remote \
              --heads origin "refs/heads/$UPDATE_BRANCH"
          )"
          remote_sha="${remote_line%%[[:space:]]*}"
          remote_ref="refs/heads/$UPDATE_BRANCH"
          if [[ -n "$remote_sha" ]]; then
            git push \
              --force-with-lease="$remote_ref:$remote_sha" \
              origin "HEAD:$remote_ref"
          else
            git push \
              --set-upstream \
              origin "HEAD:$remote_ref"
          fi

      - name: Create or update pull request
        if: steps.metadata.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          OLD_COUNT: ${{ steps.metadata.outputs.old_count }}
          NEW_COUNT: ${{ steps.metadata.outputs.new_count }}
          OLD_VERSION: ${{ steps.metadata.outputs.old_version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new_version }}
          ADDED_COUNT: ${{ steps.metadata.outputs.added_count }}
          REMOVED_COUNT: ${{ steps.metadata.outputs.removed_count }}
          MODIFIED_COUNT: ${{ steps.metadata.outputs.modified_count }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
          SOURCE_BLOB: ${{ steps.metadata.outputs.source_blob }}
        run: |
          set -euo pipefail

          title="chore: update ZZZ Liyin achievement metadata to $NEW_VERSION"
          body="$RUNNER_TEMP/liyin-metadata-pull-request.md"
          source_url="https://github.com/$UPSTREAM_REPOSITORY/commit/$SOURCE_COMMIT"
          cat > "$body" <<EOF
          此 PR 由每日 Liyin 成就元数据检查自动生成。

          | 项目 | 旧值 | 新值 |
          |---|---:|---:|
          | 最高版本 | $OLD_VERSION | $NEW_VERSION |
          | 条目数 | $OLD_COUNT | $NEW_COUNT |

          - 新增：$ADDED_COUNT
          - 删除：$REMOVED_COUNT
          - 修改：$MODIFIED_COUNT
          - 上游提交：[$SOURCE_COMMIT]($source_url)
          - 上游 Git blob：\`$SOURCE_BLOB\`

          合并前必须确认新增版本已经进入绝区零国服正式客户端。本 workflow 不会自动合并 PR，也不会自动发布 Zeitlind。
          EOF

          open_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$UPDATE_BRANCH" \
              --json number \
              --jq '.[0].number'
          )"

          if [[ -n "$open_pr" ]]; then
            gh pr edit \
              "$open_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file "$body"
            pr_url="$(
              gh pr view \
                "$open_pr" \
                --repo "$GITHUB_REPOSITORY" \
                --json url \
                --jq '.url'
            )"
          else
            if ! pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base "$BASE_BRANCH" \
                --head "$UPDATE_BRANCH" \
                --title "$title" \
                --body-file "$body"
            )"; then
              echo "Enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests." >&2
              exit 1
            fi
          fi

          echo "Pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"
