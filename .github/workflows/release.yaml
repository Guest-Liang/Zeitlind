name: Build and Release
run-name: Release ${{ inputs.version || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build win-x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --info
          gh --version

      - name: Resolve and verify release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $version = $env:REQUESTED_VERSION.Trim()
          if ($version -notmatch '^v[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "Release version must start with v and contain only letters, numbers, dots, underscores, or hyphens."
          }

          $versionSourcePath = Join-Path `
            $env:GITHUB_WORKSPACE `
            'src\Zeitlind.App\ApplicationBuildInfo.cs'
          $versionSource = Get-Content -LiteralPath $versionSourcePath -Raw
          $versionMatches = [regex]::Matches(
            $versionSource,
            'public\s+const\s+string\s+Version\s*=\s*"([^"]+)"\s*;'
          )
          if ($versionMatches.Count -ne 1) {
            throw "Expected exactly one ApplicationBuildInfo.Version constant in $versionSourcePath."
          }

          $applicationVersion = $versionMatches[0].Groups[1].Value
          $tagVersion = $version.Substring(1)
          if (-not [string]::Equals(
            $applicationVersion,
            $tagVersion,
            [StringComparison]::Ordinal))
          {
            throw "Source version '$applicationVersion' does not match release tag '$version'."
          }

          "Release version: $version (source version $applicationVersion)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "application_version=$applicationVersion" >> $env:GITHUB_OUTPUT

      - name: Build Release and Debug NativeAOT executables
        id: assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          & .\build.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "NativeAOT build failed with exit code $LASTEXITCODE."
          }

          $buildDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\build'
          $releaseExe = Join-Path $buildDirectory "Zeitlind_$($env:RELEASE_VERSION)_Release.exe"
          $debugExe = Join-Path $buildDirectory "Zeitlind_$($env:RELEASE_VERSION)_Debug.exe"
          $builtFiles = @(Get-ChildItem -LiteralPath $buildDirectory -File)
          $unexpectedFiles = @(
            $builtFiles | Where-Object {
              $_.FullName -notin @($releaseExe, $debugExe)
            }
          )
          if (
            $builtFiles.Count -ne 2 -or
            $unexpectedFiles.Count -ne 0 -or
            -not (Test-Path -LiteralPath $releaseExe -PathType Leaf) -or
            -not (Test-Path -LiteralPath $debugExe -PathType Leaf)
          ) {
            $names = $builtFiles.Name -join ', '
            throw "Expected exactly the Release and Debug executables, found: $names"
          }

          "release_exe_path=$releaseExe" >> $env:GITHUB_OUTPUT
          "debug_exe_path=$debugExe" >> $env:GITHUB_OUTPUT
          "artifact_name=Zeitlind-$($env:RELEASE_VERSION)-win-x64" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.assets.outputs.artifact_name }}
          path: |
            ${{ steps.assets.outputs.release_exe_path }}
            ${{ steps.assets.outputs.debug_exe_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_EXE_PATH: ${{ steps.assets.outputs.release_exe_path }}
          DEBUG_EXE_PATH: ${{ steps.assets.outputs.debug_exe_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $version = $env:RELEASE_VERSION
          $checkedOutCommit = (git rev-parse HEAD).Trim()

          git show-ref --verify --quiet "refs/tags/$version"
          $tagExists = $LASTEXITCODE -eq 0
          if ($tagExists) {
            $tagCommit = (git rev-list -n 1 $version).Trim()
            if ($tagCommit -ne $checkedOutCommit) {
              throw "Tag $version points to $tagCommit, but the workflow built $checkedOutCommit."
            }
          }

          gh release view $version --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit `
              $version `
              --repo $env:GITHUB_REPOSITORY `
              --title $version
            if ($LASTEXITCODE -ne 0) {
              throw "Updating GitHub Release $version failed with exit code $LASTEXITCODE."
            }

            gh release upload `
              $version `
              $env:RELEASE_EXE_PATH `
              $env:DEBUG_EXE_PATH `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Uploading GitHub Release $version assets failed with exit code $LASTEXITCODE."
            }
            exit 0
          }

          $arguments = @(
            'release', 'create',
            $version,
            $env:RELEASE_EXE_PATH,
            $env:DEBUG_EXE_PATH,
            '--repo', $env:GITHUB_REPOSITORY,
            '--title', $version,
            '--generate-notes'
          )
          if ($tagExists) {
            $arguments += '--verify-tag'
          }
          else {
            $arguments += @('--target', $checkedOutCommit)
          }
          if ($version.Contains('-')) {
            $arguments += '--prerelease'
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Creating GitHub Release $version failed with exit code $LASTEXITCODE."
          }
