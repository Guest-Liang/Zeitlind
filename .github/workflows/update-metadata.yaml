name: 检查成就元数据更新
run-name: Check achievement metadata for ZZZ, HSR, and Genshin

on:
  schedule:
    # 每天 UTC+8 10:17 同时检查三款游戏
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check ${{ matrix.label }} metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: zzz
            game_name: 绝区零
            label: ZZZ Liyin
            source: liyin
            repository: Ticca-Liyin/zzz.liyin.space
            branch: main
            metadata_file: ZzzAchievementInfo.json
            id_field: Id
            minimum_count: 100
            trim_version_whitespace: false
            compare_mode: blob
          - game: hsr
            game_name: 崩坏：星穹铁道
            label: HSR Liyin
            source: liyin
            repository: Ticca-Liyin/liyin.space
            branch: master
            metadata_file: HsrAchievementInfo.json
            id_field: AchievementID
            minimum_count: 1000
            trim_version_whitespace: true
            compare_mode: json
          - game: genshin
            game_name: 原神
            label: Genshin Yae
            source: yae
            metadata_file: GenshinAchievementInfo.json
    concurrency:
      # 沿用原工作流的分组，同一游戏串行，不同游戏互不阻塞。
      group: update-${{ matrix.game }}-${{ matrix.source }}-achievement-metadata
      cancel-in-progress: false
    env:
      GAME_NAME: ${{ matrix.game_name }}
      CATALOG_LABEL: ${{ matrix.label }}
      SOURCE_KIND: ${{ matrix.source }}
      UPSTREAM_REPOSITORY: ${{ matrix.repository }}
      UPSTREAM_BRANCH: ${{ matrix.branch }}
      UPSTREAM_PATH: src/jsons/AchievementInfo.json
      METADATA_PATH: src/Zeitlind.Protocol/Metadata/${{ matrix.metadata_file }}
      UPDATE_BRANCH: automation/update-${{ matrix.game }}-${{ matrix.source }}-achievement-metadata
      ID_FIELD: ${{ matrix.id_field }}
      MINIMUM_COUNT: ${{ matrix.minimum_count }}
      TRIM_VERSION_WHITESPACE: ${{ matrix.trim_version_whitespace }}
      COMPARE_MODE: ${{ matrix.compare_mode }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Continue an existing update pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --head "$UPDATE_BRANCH" \
              --search 'sort:created-desc' \
              --limit 1 \
              --json number,state \
              --jq '.[0] // {}'
          )"
          pr_number="$(jq -r '.number // empty' <<< "$latest_pr")"
          pr_state="$(jq -r '.state // empty' <<< "$latest_pr")"

          if [[ "$pr_state" == "OPEN" ]]; then
            open_pr="$pr_number"
          else
            open_pr=""
          fi

          if [[ "$pr_state" == "MERGED" ]]; then
            remote_branch="$(
              git ls-remote \
                --heads origin "refs/heads/$UPDATE_BRANCH"
            )"
            if [[ -n "$remote_branch" ]]; then
              git push origin --delete "$UPDATE_BRANCH"
              echo \
                "Deleted $UPDATE_BRANCH after merged pull request #$pr_number." \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [[ -n "$open_pr" ]]; then
            git fetch \
              origin \
              "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
            git switch \
              --force-create \
              "$UPDATE_BRANCH" \
              "refs/remotes/origin/$UPDATE_BRANCH"
          fi


      - name: Download, validate, and compare metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$SOURCE_KIND" == "yae" ]]; then
            python3 tools/update-genshin-metadata.py \
              --output "$METADATA_PATH" \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          candidate="$RUNNER_TEMP/AchievementInfo.json"
          content_json="$(
            gh api \
              "repos/$UPSTREAM_REPOSITORY/contents/$UPSTREAM_PATH?ref=$UPSTREAM_BRANCH"
          )"
          download_url="$(jq -r '.download_url' <<< "$content_json")"
          upstream_blob="$(jq -r '.sha' <<< "$content_json")"
          upstream_size="$(jq -r '.size' <<< "$content_json")"
          source_commit="$(
            gh api \
              "repos/$UPSTREAM_REPOSITORY/commits?path=$UPSTREAM_PATH&sha=$UPSTREAM_BRANCH&per_page=1" \
              --jq '.[0].sha'
          )"

          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid upstream commit: $source_commit" >&2
            exit 1
          fi
          if [[ ! "$upstream_blob" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid upstream Git blob: $upstream_blob" >&2
            exit 1
          fi
          if [[ "$download_url" != \
              "https://raw.githubusercontent.com/$UPSTREAM_REPOSITORY/"* ]]; then
            echo "Unexpected upstream download URL: $download_url" >&2
            exit 1
          fi
          if (( upstream_size <= 0 || upstream_size > 4194304 )); then
            echo "Unexpected upstream size: $upstream_size bytes" >&2
            exit 1
          fi

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 45 \
            --output "$candidate" \
            "$download_url"

          downloaded_size="$(wc -c < "$candidate")"
          if [[ "$downloaded_size" -ne "$upstream_size" ]]; then
            echo "Downloaded $downloaded_size bytes; GitHub reported $upstream_size." >&2
            exit 1
          fi

          downloaded_blob="$(git hash-object --no-filters "$candidate")"
          if [[ "$downloaded_blob" != "$upstream_blob" ]]; then
            echo "Downloaded Git blob $downloaded_blob does not match $upstream_blob." >&2
            exit 1
          fi

          validate_filter='
            type == "object" and
            length >= $minimum_count and
            all(
              to_entries[];
              (.key | test("^[0-9]{7}$")) and
              (.value | type == "object") and
              (.value[$id_field] | type == "number") and
              ((.value[$id_field] | tostring) == .key) and
              (.value.Version | type == "string") and
              (.value.Version | if $trim_version then gsub("^\\s+|\\s+$"; "") else . end | test("^[0-9]+(\\.[0-9]+){1,2}$"))
            )
          '
          for metadata_file in "$METADATA_PATH" "$candidate"; do
            jq --exit-status \
              --arg id_field "$ID_FIELD" \
              --argjson minimum_count "$MINIMUM_COUNT" \
              --argjson trim_version "$TRIM_VERSION_WHITESPACE" \
              "$validate_filter" "$metadata_file" > /dev/null
          done

          old_count="$(jq 'length' "$METADATA_PATH")"
          new_count="$(jq 'length' "$candidate")"
          if (( new_count * 10 < old_count * 8 )); then
            echo "Catalog shrank from $old_count to $new_count; refusing automatic update." >&2
            exit 1
          fi

          version_filter='
            [.[].Version | gsub("^\\s+|\\s+$"; "")]
            | unique
            | sort_by(split(".") | map(tonumber))
            | last
          '
          old_version="$(jq -r "$version_filter" "$METADATA_PATH")"
          new_version="$(jq -r "$version_filter" "$candidate")"
          added_count="$(
            jq \
              --null-input \
              --slurpfile old "$METADATA_PATH" \
              --slurpfile new "$candidate" \
              '($new[0] | keys) - ($old[0] | keys) | length'
          )"
          removed_count="$(
            jq \
              --null-input \
              --slurpfile old "$METADATA_PATH" \
              --slurpfile new "$candidate" \
              '($old[0] | keys) - ($new[0] | keys) | length'
          )"
          modified_count="$(
            jq \
              --null-input \
              --slurpfile old "$METADATA_PATH" \
              --slurpfile new "$candidate" \
              '[
                ($new[0] | keys[]) as $key
                | select(
                    ($old[0] | has($key)) and
                    ($new[0][$key] != $old[0][$key])
                  )
              ] | length'
          )"

          if [[ "$COMPARE_MODE" == "blob" ]]; then
            current_blob="$(git hash-object --no-filters "$METADATA_PATH")"
            if [[ "$current_blob" == "$downloaded_blob" ]]; then
              changed=false
            else
              changed=true
            fi
          elif jq \
            --exit-status \
            --null-input \
            --slurpfile current "$METADATA_PATH" \
            --slurpfile candidate "$candidate" \
            '$current[0] == $candidate[0]' > /dev/null; then
            changed=false
          else
            changed=true
          fi
          if [[ "$changed" == true ]]; then
            cp "$candidate" "$METADATA_PATH"
          fi

          {
            echo "changed=$changed"
            echo "old_count=$old_count"
            echo "new_count=$new_count"
            echo "old_version=$old_version"
            echo "new_version=$new_version"
            echo "added_count=$added_count"
            echo "removed_count=$removed_count"
            echo "modified_count=$modified_count"
            echo "source_url=https://github.com/$UPSTREAM_REPOSITORY/blob/$source_commit/$UPSTREAM_PATH"
            echo "source_commit=$source_commit"
            echo "source_blob=$downloaded_blob"
          } >> "$GITHUB_OUTPUT"

          if [[ "$changed" == true ]]; then
            heading="$CATALOG_LABEL achievement metadata update found"
          else
            heading="$CATALOG_LABEL achievement metadata is current"
          fi
          {
            echo "## $heading"
            echo
            echo "| Metric | Old | New |"
            echo "|---|---:|---:|"
            echo "| Latest version | $old_version | $new_version |"
            echo "| Entries | $old_count | $new_count |"
            echo
            echo "- Added: $added_count"
            echo "- Removed: $removed_count"
            echo "- Modified: $modified_count"
            echo "- Upstream commit: \`$source_commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push metadata update
        if: steps.metadata.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git diff --check
          if [[ "$(git branch --show-current)" != "$UPDATE_BRANCH" ]]; then
            git switch --force-create "$UPDATE_BRANCH"
          fi
          git config user.name "github-actions[bot]"
          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$METADATA_PATH"
          git commit -m "chore: update $CATALOG_LABEL achievement metadata"

          remote_line="$(
            git ls-remote \
              --heads origin "refs/heads/$UPDATE_BRANCH"
          )"
          remote_sha="${remote_line%%[[:space:]]*}"
          remote_ref="refs/heads/$UPDATE_BRANCH"
          if [[ -n "$remote_sha" ]]; then
            git push \
              --force-with-lease="$remote_ref:$remote_sha" \
              origin "HEAD:$remote_ref"
          else
            git push \
              --set-upstream \
              origin "HEAD:$remote_ref"
          fi

      - name: Create or update pull request
        if: steps.metadata.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          OLD_COUNT: ${{ steps.metadata.outputs.old_count }}
          NEW_COUNT: ${{ steps.metadata.outputs.new_count }}
          OLD_VERSION: ${{ steps.metadata.outputs.old_version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new_version }}
          ADDED_COUNT: ${{ steps.metadata.outputs.added_count }}
          REMOVED_COUNT: ${{ steps.metadata.outputs.removed_count }}
          MODIFIED_COUNT: ${{ steps.metadata.outputs.modified_count }}
          SOURCE_URL: ${{ steps.metadata.outputs.source_url }}
          SOURCE_SHA256: ${{ steps.metadata.outputs.source_sha256 }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
          SOURCE_BLOB: ${{ steps.metadata.outputs.source_blob }}
        run: |
          set -euo pipefail

          title="chore: update $CATALOG_LABEL achievement metadata to $NEW_VERSION"
          body="$RUNNER_TEMP/metadata-pull-request.md"
          {
            cat <<EOF
          此 PR 由每日${GAME_NAME}成就元数据检查自动生成，数据来源为 $CATALOG_LABEL。

          | 项目 | 旧值 | 新值 |
          |---|---:|---:|
          | 最高版本 | $OLD_VERSION | $NEW_VERSION |
          | 条目数 | $OLD_COUNT | $NEW_COUNT |

          - 新增：$ADDED_COUNT
          - 删除：$REMOVED_COUNT
          - 修改：$MODIFIED_COUNT
          - 上游数据：[$SOURCE_URL]($SOURCE_URL)
          EOF
            if [[ -n "$SOURCE_COMMIT" ]]; then
              echo "- 上游提交：[$SOURCE_COMMIT](https://github.com/$UPSTREAM_REPOSITORY/commit/$SOURCE_COMMIT)"
              echo "- 上游 Git blob：\`$SOURCE_BLOB\`"
            fi
            if [[ -n "$SOURCE_SHA256" ]]; then
              echo "- 上游数据 SHA-256：\`$SOURCE_SHA256\`"
            fi
            if [[ "$SOURCE_KIND" == "yae" ]]; then
              echo
              echo "Version 表示成就目录快照版本，不表示每项成就的首次上线版本。仅同步成就目录，不导入 Yae 的协议字段号或原生偏移。"
            fi
            echo
            echo "合并前必须确认新增版本已经进入${GAME_NAME}国服正式客户端。本 workflow 不会自动合并 PR，也不会自动发布 Zeitlind。"
          } > "$body"

          open_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$UPDATE_BRANCH" \
              --json number \
              --jq '.[0].number'
          )"

          if [[ -n "$open_pr" ]]; then
            gh pr edit \
              "$open_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file "$body"
            pr_url="$(
              gh pr view \
                "$open_pr" \
                --repo "$GITHUB_REPOSITORY" \
                --json url \
                --jq '.url'
            )"
          else
            if ! pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base "$BASE_BRANCH" \
                --head "$UPDATE_BRANCH" \
                --title "$title" \
                --body-file "$body"
            )"; then
              echo "Enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests." >&2
              exit 1
            fi
          fi

          echo "Pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"
